name: J-POP research checks
on:
  push:
    branches:
      - feature/jpop-research-data
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py jpop_research.py
      - run: python -m unittest discover -s tests -v
